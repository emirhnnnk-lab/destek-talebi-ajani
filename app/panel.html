<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destek Ajanı Paneli</title><style>
:root{--bg:#0f1115;--c:#171a21;--l:#2a2f3a;--t:#e8ebf1;--m:#8a93a6;--g:#3ecf8e;--y:#f5b942;--r:#ff6b6b;--b:#5aa9ff}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:1100px;margin:0 auto;padding:28px 20px}h1{font-size:20px;margin:0}.s{color:var(--m);margin:4px 0 18px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.kc{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px}
.kc b{font-size:24px;display:block}.f{display:flex;gap:8px;margin-bottom:12px}textarea{flex:1;min-height:56px;background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--b);color:#041021}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.ex span{border:1px solid var(--l);border-radius:999px;padding:4px 10px;color:var(--m);cursor:pointer;font-size:12px}
.t{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.d{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.otomatik_cozuldu,.onaylandi{background:#11301f;color:var(--g)}.onay_bekliyor{background:#33280f;color:var(--y)}.insana_devredildi,.reddedildi{background:#2b1c1c;color:var(--r)}
.a{font-size:12px;color:var(--m);margin-top:6px}.y{margin-top:8px;padding:8px 10px;border-left:3px solid var(--b);background:#11161f;white-space:pre-wrap}
.ret{background:#3a2a2a;color:#ffb3b3}
</style></head><body><div class="w">
<h1>Destek Talebi Otomasyon Ajanı</h1><p class="s">Gelen talebi sınıflandırır, araçlarla çözer; iade ve iptal gibi riskli işlemleri insan onayına bırakır. Lokal LLM (Ollama).</p>
<div class="k"><div class="kc">Otomatik çözüldü<b id="k1">0</b></div><div class="kc">Onay bekliyor<b id="k2">0</b></div><div class="kc">İnsana devredildi<b id="k3">0</b></div><div class="kc">Otomasyon oranı<b id="k4">–</b></div></div>
<div class="f"><textarea id="m" placeholder="Müşteri mesajı…"></textarea><button onclick="gonder()">Gönder</button></div>
<div class="ex" id="ex"></div><div id="list"></div></div>
<script>
const ornek=["Merhaba, M1001 numaralı aboneliğimde internet sabahtan beri yok.","Geçen ayın faturasını tekrar gönderir misiniz? Müşteri no M1003","Şifremi unuttum, online işlemlere giremiyorum. M1005","Bu ay faturam iki kat gelmiş, fazlasının iadesini istiyorum. M1002","Taşınıyorum, M1004 aboneliğimi kapatmak istiyorum.","Ofisinizin adresi nedir?"];
ex.innerHTML=ornek.map(o=>"<span>"+o+"</span>").join("");
ex.onclick=e=>{if(e.target.tagName==="SPAN"){m.value=e.target.textContent;gonder()}};
const tr={otomatik_cozuldu:"otomatik çözüldü",onay_bekliyor:"onay bekliyor",insana_devredildi:"insana devredildi",onaylandi:"onaylandı",reddedildi:"reddedildi"};
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function gonder(){if(!m.value.trim())return;list.insertAdjacentHTML("afterbegin",'<div class="t">Ajan çalışıyor…</div>');
 await fetch("/webhook/talep",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({metin:m.value})});m.value="";yukle()}
async function onay(id,k){await fetch("/onay/"+id+"?karar="+k,{method:"POST"});yukle()}
function kart(t){
 const btn=t.durum==="onay_bekliyor"?'<div style="margin-top:8px;display:flex;gap:6px"><button data-id="'+t.id+'" data-k="onayla">Onayla</button><button class="ret" data-id="'+t.id+'" data-k="reddet">Reddet</button></div>':"";
 return '<div class="t"><div class="h"><b>'+t.id+' · '+t.sinif.kategori+'</b><span class="d '+t.durum+'">'+tr[t.durum]+'</span></div>'+
 '<div>'+esc(t.metin)+'</div><div class="a">Araçlar: '+(t.araclar.map(a=>a.arac).join(" → ")||"yok")+'</div><div class="y">'+esc(t.yanit)+'</div>'+btn+'</div>'}
list.onclick=e=>{const b=e.target.closest("button[data-id]");if(b)onay(b.dataset.id,b.dataset.k)};
async function yukle(){const r=await fetch("/talepler").then(r=>r.json()),o=r.ozet;
 k1.textContent=o.otomatik_cozuldu;k2.textContent=o.onay_bekliyor;k3.textContent=o.insana_devredildi;
 const n=r.talepler.length;k4.textContent=n?Math.round(100*o.otomatik_cozuldu/n)+"%":"–";
 list.innerHTML=r.talepler.map(kart).join("")}
yukle();
</script></body></html>
